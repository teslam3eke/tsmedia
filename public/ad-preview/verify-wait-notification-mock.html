<!DOCTYPE html>
<html lang="zh-TW" class="h-full bg-[#fafafa]">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#fafafa" />
  <title>等待審核（真實版面模擬）</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: [
              'ui-sans-serif', 'system-ui', '-apple-system', 'BlinkMacSystemFont',
              'Segoe UI', 'PingFang TC', 'Microsoft JhengHei', 'Noto Sans TC', 'sans-serif',
            ],
          },
        },
      },
    }
  </script>
  <style>
    * { -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }
    html, body { margin: 0; background: #fafafa; }
    .bell svg { width: 20px; height: 20px; stroke: white; fill: none; stroke-width: 2; }
    .ticket svg { width: 16px; height: 16px; stroke: #9b753d; fill: none; stroke-width: 2; }
    .ext svg { width: 12px; height: 12px; stroke: #946a30; fill: none; stroke-width: 2; display: inline; vertical-align: -2px; }
    .step-line {
      position: absolute;
      left: 13px;
      top: 28px;
      height: calc(100% + 10px);
      width: 1px;
      background: linear-gradient(to bottom, #c7a46e, #e6d8c1);
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .spin-ring { animation: spin 0.9s linear infinite; }
    .spin-icon { animation: spin 1s linear infinite; }
  </style>
</head>
<body class="min-h-dvh bg-[#fafafa] font-sans text-slate-900">
  <!-- 與 IdentityVerifyScreen waitingForReview 相同外層 -->
  <div id="screen" class="min-h-dvh max-w-md mx-auto flex flex-col items-center overflow-y-auto bg-[#fafafa] px-6 pb-[calc(env(safe-area-inset-bottom,0px)+32px)] pt-[calc(env(safe-area-inset-top,0px)+32px)] text-center">
    <div class="my-auto w-full space-y-5">
      <div class="relative mx-auto flex h-16 w-16 items-center justify-center">
        <div class="absolute inset-0 rounded-full border-2 border-slate-200 border-t-slate-800 spin-ring" aria-hidden="true"></div>
        <svg class="relative h-7 w-7 text-slate-800" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"/></svg>
      </div>
      <div class="space-y-2">
        <h2 class="text-xl font-bold text-slate-900">正在進行安全審核</h2>
        <p class="text-sm leading-relaxed text-slate-500">
          為降低假帳號與詐騙風險，
          <br />
          新會員申請都必須通過安全審核。
        </p>
      </div>
      <div class="flex items-center justify-center gap-2 text-slate-500" role="status">
        <svg class="h-5 w-5 spin-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M21 12a9 9 0 1 1-6.219-8.56"/></svg>
        <span class="text-sm font-medium">審核中…</span>
      </div>
      <p class="text-xs text-slate-400">通常於 1 分鐘內完成</p>

      <div class="mx-auto w-full max-w-[340px] rounded-2xl bg-white p-4 text-left shadow-sm ring-1 ring-slate-200">
        <div class="flex items-start gap-3">
          <div class="bell flex h-10 w-10 shrink-0 items-center justify-center rounded-xl bg-slate-900">
            <svg viewBox="0 0 24 24"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
          </div>
          <p class="pt-0.5 text-[13px] leading-relaxed text-slate-600">
            若在審核通過時，您有保持通知開啟，
            <br />
            即可獲得相關折扣（配合全站活動）
          </p>
        </div>
        <button type="button" class="mx-auto mt-3 block w-[35%] min-w-[5.95rem] rounded-xl bg-slate-900 py-2.5 text-sm font-semibold text-white">
          開啟通知
        </button>
      </div>

      <div class="mx-auto w-full max-w-[340px] rounded-2xl bg-[#faf5ec] p-3.5 text-left ring-1 ring-[#e4d5bc]">
        <div class="flex items-center gap-2">
          <span class="ticket" aria-hidden="true">
            <svg viewBox="0 0 24 24"><path d="M2 9a3 3 0 0 1 3-3h14a1 1 0 0 1 1 1v4a1 1 0 0 1-1 1H5a3 3 0 0 1-3-3z"/><path d="M9 9h.01"/><path d="M15 9h.01"/></svg>
          </span>
          <p class="text-[12px] font-black tracking-[0.08em] text-[#5f4a2d]">領取 100 元抵用券</p>
        </div>
        <ol class="relative mt-3 space-y-2.5">
          <li class="relative flex items-center gap-3">
            <span class="step-line" aria-hidden="true"></span>
            <span class="relative z-10 flex h-7 w-7 shrink-0 items-center justify-center rounded-full bg-gradient-to-b from-[#c6a264] to-[#9d7740] text-[12px] font-black text-white shadow-sm ring-2 ring-[#f5ecde]">1</span>
            <div class="min-w-0 text-left">
              <p class="text-[11px] font-black tracking-[0.04em] text-[#574a3b]">前往 Instagram</p>
              <p class="mt-0.5 text-[10px] font-medium text-[#8d7e6c]">
                <span class="inline-flex items-center gap-1 font-black text-[#946a30] underline decoration-[#c8a36d] underline-offset-2">@tsmedia_tw<span class="ext"><svg viewBox="0 0 24 24"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><path d="M15 3h6v6"/><path d="M10 14 21 3"/></svg></span></span>
              </p>
            </div>
          </li>
          <li class="relative flex items-center gap-3">
            <span class="step-line" aria-hidden="true"></span>
            <span class="relative z-10 flex h-7 w-7 shrink-0 items-center justify-center rounded-full bg-gradient-to-b from-[#c6a264] to-[#9d7740] text-[12px] font-black text-white shadow-sm ring-2 ring-[#f5ecde]">2</span>
            <div class="min-w-0 text-left">
              <p class="text-[11px] font-black tracking-[0.04em] text-[#574a3b]">點擊「追蹤」</p>
              <p class="mt-0.5 text-[10px] font-medium text-[#8d7e6c]">掌握最新活動消息</p>
            </div>
          </li>
          <li class="relative flex items-center gap-3">
            <span class="relative z-10 flex h-7 w-7 shrink-0 items-center justify-center rounded-full bg-gradient-to-b from-[#c6a264] to-[#9d7740] text-[12px] font-black text-white shadow-sm ring-2 ring-[#f5ecde]">3</span>
            <div class="min-w-0 text-left">
              <p class="text-[11px] font-black tracking-[0.04em] text-[#574a3b]">私訊「折扣碼」</p>
              <p class="mt-0.5 text-[10px] font-medium text-[#8d7e6c]">取得專屬兌換代碼</p>
            </div>
          </li>
        </ol>
        <div class="mt-3 rounded-xl border border-[#e1c99f] bg-gradient-to-r from-[#fffaf1] to-[#f5ead8] px-3 py-2.5 text-center">
          <p class="text-[11px] font-black tracking-[0.04em] text-[#805e2f]">完成後即可獲得 NT$100 會員抵用券</p>
        </div>
      </div>

      <div class="mx-auto flex w-full max-w-[300px] flex-col gap-2 pt-2">
        <button type="button" class="w-full rounded-2xl bg-white py-3 text-sm font-bold text-slate-800 shadow-sm ring-1 ring-slate-200">編輯個人資料</button>
        <button type="button" class="w-full rounded-2xl bg-white py-3 text-sm font-bold text-slate-800 shadow-sm ring-1 ring-slate-200">修改問卷答案</button>
        <button type="button" class="flex w-full items-center justify-center gap-1.5 rounded-2xl py-2.5 text-sm font-semibold text-slate-500">登出</button>
      </div>
    </div>
  </div>
</body>
</html>
